[package]
name = "tohdr-core"
version = "0.1.0"
description = "Flavor-neutral HDR gain-map model, ISO 21496-1 serialization, and Apple MakerNote headroom math"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]

[dev-dependencies]
# Independent oracle for our ISO 21496-1 serializer. Deliberately NOT a runtime
# dependency: we cross-check against it rather than trust it in the hot path.
# default-features off: its `tonemap` feature pulls AGPL-3.0-only zentone, which
# we do not use and cargo-deny does not see through dev-dependencies.
ultrahdr-core = { version = "0.6", default-features = false, features = ["std"] }
